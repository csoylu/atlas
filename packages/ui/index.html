<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before the first paint (no flash). Kept in sync with src/theme.ts.
      (function () {
        // ?theme=light previews a theme without saving it. « gray » was dropped (13 Nov 2026): it reads as dark.
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('atlas.theme');
        if (t === 'gray') t = 'dark';
        if (t !== 'light' && t !== 'dark')
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
